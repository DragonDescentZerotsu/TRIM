[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trim"
version = "0.1.0"
description = "Pure-ML infrastructure for scaffold-split TDC molecular classification."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.26,<2.0",
  "pandas>=2.1,<2.3",
  "scipy>=1.11,<1.14",
  "scikit-learn>=1.3,<1.6",
  "interpret>=0.6,<0.7",
  "rdkit>=2023.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

